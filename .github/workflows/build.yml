name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests (JVM) and debug APK
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-adblock-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests on the iPhone simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build the app for the simulator (unsigned)
        run: |
          xcodebuild -project iosApp/PocketAdBlock.xcodeproj -scheme PocketAdBlock \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Smoke test on a simulator (starts, stays up, screenshot)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "simulator $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/PocketAdBlock.app
          xcrun simctl launch "$DEVICE" io.github.joanrra2.pocketadblock
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ios-smoke.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q pocketadblock || { echo "the app is not running (crashed?)"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-smoke-screenshot
          path: ios-smoke.png
          if-no-files-found: ignore
