name: e2e

# Both apps on an Android emulator, against the fake board (tools/fake_board.py):
# find and log in with Pocket AdBlock, then hand the board's broker to Pocket Wake.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pocketwake_ref:
        description: Pocket Wake branch or tag to test with
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Get Pocket Wake
        run: |
          ref="${{ inputs.pocketwake_ref || 'main' }}"
          git clone --depth 1 --branch "$ref" https://github.com/joanrra2/pocket-wake.git pocket-wake \
            || git clone --depth 1 https://github.com/joanrra2/pocket-wake.git pocket-wake
          git -C pocket-wake log --oneline -1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Release builds (R8-minified), as people install them, signed with a throwaway
      # key made here: the real signing keys are only used by the release workflow.
      - name: Build both release APKs
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/e2e.jks" -storetype PKCS12 -alias e2e -keyalg RSA -keysize 2048 -validity 7 -storepass e2e-test -keypass e2e-test -dname CN=e2e
          export POCKETADBLOCK_KEYSTORE_FILE="$RUNNER_TEMP/e2e.jks" POCKETADBLOCK_KEY_ALIAS=e2e POCKETADBLOCK_KEYSTORE_PASSWORD=e2e-test POCKETADBLOCK_KEY_PASSWORD=e2e-test
          export POCKETWAKE_KEYSTORE_FILE="$RUNNER_TEMP/e2e.jks" POCKETWAKE_KEY_ALIAS=e2e POCKETWAKE_KEYSTORE_PASSWORD=e2e-test POCKETWAKE_KEY_PASSWORD=e2e-test
          ./gradlew :androidApp:assembleRelease
          chmod +x pocket-wake/gradlew
          (cd pocket-wake && ./gradlew :app:assembleRelease)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 4
          script: E2E_APP_PKG=io.github.joanrra2.pocketadblock E2E_WAKE_PKG=io.github.joanrra2.pocketwake bash tools/e2e_android.sh androidApp/build/outputs/apk/release/androidApp-release.apk pocket-wake/app/build/outputs/apk/release/app-release.apk e2e-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
          if-no-files-found: ignore
