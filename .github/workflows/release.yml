name: release

# Push a tag like v0.2.0 to build the apps and attach them to a GitHub release:
#   - Android: a signed APK.
#   - iPhone: an unsigned .ipa (no Apple developer account); people sign it with their
#     own free Apple ID using a sideloading tool (see the README).
# Tags with a suffix (v0.3.0-beta.1) become pre-releases. Run it by hand (Actions ->
# release -> Run workflow) to build both files without publishing anything.
# Needs these repository secrets (the signing key never lives in the repository):
#   POCKETADBLOCK_KEYSTORE_B64       base64 of the release keystore (.jks)
#   POCKETADBLOCK_KEYSTORE_PASSWORD  its password
#   POCKETADBLOCK_KEY_ALIAS          the key alias
#   POCKETADBLOCK_KEY_PASSWORD       the key password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # v0.2.0 -> 0.2.0; a manual run gets a dev version.
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}-dev', github.run_number) }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.POCKETADBLOCK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::POCKETADBLOCK_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POCKETADBLOCK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Tests and signed release APK
        env:
          POCKETADBLOCK_KEYSTORE_PASSWORD: ${{ secrets.POCKETADBLOCK_KEYSTORE_PASSWORD }}
          POCKETADBLOCK_KEY_ALIAS: ${{ secrets.POCKETADBLOCK_KEY_ALIAS }}
          POCKETADBLOCK_KEY_PASSWORD: ${{ secrets.POCKETADBLOCK_KEY_PASSWORD }}
          POCKETADBLOCK_VERSION: ${{ env.APP_VERSION }}
        run: ./gradlew :shared:jvmTest :androidApp:assembleRelease --stacktrace
      - name: Name the APK after the version
        run: |
          v="${APP_VERSION#v}"
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/pocket-adblock-$v.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist
          if-no-files-found: error

  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build the app for iPhone (Release, unsigned)
        run: |
          v="${APP_VERSION#v}"
          xcodebuild -project iosApp/PocketAdBlock.xcodeproj -scheme PocketAdBlock \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            MARKETING_VERSION="${v%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package the .ipa
        run: |
          v="${APP_VERSION#v}"
          app=build/ios/Build/Products/Release-iphoneos/PocketAdBlock.app
          test -x "$app/PocketAdBlock" || { echo "::error::no app binary"; ls -la "$app"; exit 1; }
          lipo -info "$app/PocketAdBlock"
          got=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleVersion' "$app/Info.plist"
          echo "version $got"
          [ "$got" = "${v%%-*}" ] || { echo "::error::app version is $got, expected ${v%%-*}"; exit 1; }
          mkdir -p dist Payload
          cp -R "$app" Payload/
          zip -qry "dist/pocket-adblock-$v-unsigned.ipa" Payload
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          sed "s/{VERSION}/$v/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pocket AdBlock $v" --notes-file notes.md --generate-notes $pre
