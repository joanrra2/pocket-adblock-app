# XcodeGen spec for the iPhone app. Generate the Xcode project on a Mac with:
#   brew install xcodegen && cd iosApp && xcodegen generate
# (CI does the same; the .xcodeproj is not committed.)
name: PocketAdBlock
options:
  bundleIdPrefix: io.github.joanrra2
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketAdBlock:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: ["Info.plist"]
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Pocket AdBlock
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Finding boards on the Wi-Fi (Bonjour and plain HTTP to local addresses only).
        NSLocalNetworkUsageDescription: Pocket AdBlock looks for your boards on this Wi-Fi to show and open their settings.
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Face ID protects a board's settings if you turn that on.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joanrra2.pocketadblock
        PRODUCT_NAME: PocketAdBlock
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin (shared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
